#elasticsearch parameters
elasticsearch.host=localhost
elasticsearch.port=9200
com.example.stacktradeapp.elasticsearch.indexName=spring_jira_index

#mongodb parameters
spring.data.mongodb.uri=mongodb://localhost:27017/JiraRepos
spring.data.mongodb.database=JiraRepos
com.example.stacktradeapp.mongodb.collection.name=TicketsCollection



#cors parameters
cors.allowedOrigins=https://localhost:4200
cors.allowedMethods=GET,POST,PUT,DELETE
cors.allowedHeaders=*
cors.allowCredentials=true

#milvus parameters
com.example.stacktradeapp.milvus.host=localhost
com.example.stacktradeapp.milvus.port=19530
com.example.stacktradeapp.milvus.summary.collection.name=spring_jira_summary_Collection
com.example.stacktradeapp.milvus.collections.id.field.name=ticket_id
com.example.stacktradeapp.milvus.summary.collection.vector.field.name=summary_vector
com.example.stacktradeapp.milvus.description.collection.name=spring_jira_description_Collection
com.example.stacktradeapp.milvus.description.collection.id.field.name=ticket_id
com.example.stacktradeapp.milvus.description.collection.vector.field.name=description_vector



